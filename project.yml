name: InfiniteRideUltimate
options:
  bundleIdPrefix: com.infiniteboost45
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "5.5"
    CURRENT_PROJECT_VERSION: "550"
targets:
  InfiniteRideUltimate:
    type: application
    platform: iOS
    sources:
      - path: InfiniteRideUltimate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infiniteboost45.infiniterideultimate
        PRODUCT_NAME: InfiniteRide
        INFOPLIST_FILE: InfiniteRideUltimate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
