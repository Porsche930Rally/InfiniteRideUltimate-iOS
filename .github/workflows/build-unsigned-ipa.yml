name: Build Scarlet IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project InfiniteRideUltimate.xcodeproj \
            -scheme InfiniteRideUltimate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release-iphoneos/InfiniteRide.app"
          test -d "$APP"
          test -x "$APP/InfiniteRide"
          mkdir -p Payload
          ditto "$APP" "Payload/InfiniteRide.app"
          /usr/bin/zip -qry InfiniteRideUltimate-iOS-5.6-Scarlet.ipa Payload
          shasum -a 256 InfiniteRideUltimate-iOS-5.6-Scarlet.ipa > InfiniteRideUltimate-iOS-5.6-Scarlet.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteRideUltimate-iOS-Scarlet
          path: |
            InfiniteRideUltimate-iOS-5.6-Scarlet.ipa
            InfiniteRideUltimate-iOS-5.6-Scarlet.sha256
          if-no-files-found: error
          retention-days: 30
